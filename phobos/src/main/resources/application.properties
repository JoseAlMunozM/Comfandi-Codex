spring.application.name=phobos
server.port=8080

# Configuracion de la base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver



#Configuracion healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#Configuracion de Hibernate (manejo de entidades en JPA)
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.driver-class-name=org.postgresql.Driver
spring.flyway.baseline-on-migrate=true
spring.flyway.database-type=postgresql
spring.flyway.locations=classpath:db/migrations

# Configuracion del Scheduler (si deseas ajustar)
task.execution.pool.size=5
task.scheduling.pool.size=10

api.korlon_baseurl=${KORLON_BASE_URL}
api.korlon-user-name=${KORLON_USER_NAME}
api.korlon-user-password=${KORLON_USER_PASSWORD}

api.basic_auth_user=${BASIC_AUTH_USER}
api.basic_auth_password=${BASIC_AUTH_PASSWORD}

api.fomento_baseurl=${BASE_URL_FOMENTO}

api.personas_baseurl=${BASE_URL_PERSONAS}
api.personas_apikey=${APIKEY_PERSONAS}

api.jobs_baseurl=${BASE_URL_JOBS}

api.postulation_baseurl=${BASE_URL_SUBSIDIO}
api.subsidio_user=${USER_SUBSIDIO}
api.subsidio_pass=${PASS_SUBSIDIO}

api.comfandi_baseurl=${BASE_URL_COMFANDI}
api.comfandi_user=${USER_COMFANDI}
api.comfandi_pass=${PASS_COMFANDI}

api.year=2025

api.comfandi_s3url=${S3URL}



#configuracion de notificationes
api.file_email_notification=${FILE_EMAIL_NOTIFICATION}


api.cors_allowed_origins=${CORS_ALLOWED_ORIGINS}

